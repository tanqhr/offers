  .switch-wrap{

    display:flex;
    align-items:center;
    gap:10px;

    background:#fffdf2;

    padding:8px 14px;

    border-radius:12px;

    border:1px solid #f3e6a0;

    min-height:44px;
}


/* SWITCH */

.switch{

    position:relative;

    display:inline-block;

    width:52px;

    height:28px;

}


.switch input{
    opacity:0;
    width:0;
    height:0;
}


/* SLIDER */

.slider{

    position:absolute;

    cursor:pointer;

    top:0;
    left:0;
    right:0;
    bottom:0;

    background-color:#d6d6d6;

    transition:.3s;

    border-radius:34px;
}


.slider:before{

    position:absolute;

    content:"";

    height:22px;
    width:22px;

    left:3px;
    bottom:3px;

    background:white;

    transition:.3s;

    border-radius:50%;
}


/* ACTIVE */

.switch input:checked + .slider{

    background-color:#f4d03f;
}


.switch input:checked + .slider:before{

    transform:translateX(24px);
}


/* TEXT */

.switch-label{

    font-size:14px;

    font-weight:600;

    color:#2c3e50;

    white-space:nowrap;
}

    <script>
        let prices = {};
        let items = [];
        let editingOfferId = null;
        let qty = 1;
        
        
        function loadSavedData() {
            
            const saved =
            localStorage.getItem("crm_offer");
            
            if (!saved) return;
            
            const data = JSON.parse(saved);
            
            items = data.items || [];
            
            document.getElementById("clientName").value =
            data.clientName || "";
            
            document.getElementById("clientAddress").value =
            data.clientAddress || "";
            
            document.getElementById("note").value =
            data.note || "";
            
            render();
        }
        fetch('./prices.json')
        .then(r => r.json())
        .then(data => {
            
            prices = data;
            
            loadCategories();
            
            loadSavedData();
            
            renderHistory();
            
        });
        
        
        
        
        function loadCategories() {
            let cat = document.getElementById("category");
            cat.innerHTML = "";
            
            Object.keys(prices).forEach(c => {
                let opt = document.createElement("option");
                opt.value = c;
                opt.innerText = c;
                cat.appendChild(opt);
            });
            
            loadSub();
        }
        
     

        function loadSub() {

    let cat = document.getElementById("category").value;
    let sub = document.getElementById("sub");

    let withMaterials =
    document.getElementById("withMaterials").checked;

    sub.innerHTML = "";

    Object.keys(prices[cat]).forEach(s => {

        let data = prices[cat][s];

        let price =
        withMaterials
        ? data.full
        : data.labor;

        let opt = document.createElement("option");

        opt.value = s;

        opt.innerText =
        s + " (" + price + " евро)";

        sub.appendChild(opt);

    });

}
        
    

        function add() {

            
    let room =
document.getElementById("room").value || " ";

    let cat =
    document.getElementById("category").value;

    let sub =
    document.getElementById("sub").value;

    let qty =
    parseFloat(document.getElementById("qty").value || 1);

    let withMaterials =
    document.getElementById("withMaterials").checked;

    let service =
    prices[cat][sub];

    let unit = service.unit || "бр.";

    let price =
    withMaterials
    ? service.full
    : service.labor;


    items.push({
        room,
        cat,
        sub,
        qty,
        price,
        unit,
        type:
        withMaterials
        ? "Материали и труд"
        : "Само труд"
    });

    render();

            document.getElementById("room").value = "";
            
            // document.getElementById("category").value = "";
            
            // document.getElementById("sub").value = "";

            document.getElementById("customType").value = "";
            
            document.getElementById("qty").value = "";
            
            document.getElementById("customPrice").value = "";
}
        
        function addCustom() {

            let room =
            document.getElementById("roomManual").value || " ";
            
            let category =
            document.getElementById("customCategory").value;
            
            let service =
            document.getElementById("customService").value;

            let type = document.getElementById("customType").value;
            
            let qty =
            parseFloat(
            document.getElementById("customQty").value || 1
            );

            let unit = document.getElementById("customUnit").value || "бр.";
            
            let price =
            parseFloat(
            document.getElementById("customPrice").value || 0
            );
            
            if (!category || !service || !type || qty <= 0 || price <= 0) {
                
                alert("Попълни всички полета");
                
                return;
            }
            
            items.push({
                room: room,
            
                cat: category,
                
                sub: service,

                type: type,
                
                qty: qty,

                unit: unit,
                
                price: price
            });
            
            render();
            
            // clear fields

            document.getElementById("room").value = "";

            document.getElementById("customCategory").value = "";
            
            document.getElementById("customService").value = "";

            document.getElementById("customType").value = "";
            
            document.getElementById("customQty").value = "";

            document.getElementById("customUnit").value = "";
            
            document.getElementById("customPrice").value = "";
        }
        
        function removeItem(index) {
            items.splice(index, 1);
            render();
        }
        
        



function render() {

    let list = document.getElementById("list");
    list.innerHTML = "";

    let total = 0;

    items.forEach((i, index) => {

        total += i.qty * i.price;

        list.innerHTML += `
<div class="card">

    <div class="card-content">

        <b>${i.room || " "}</b>
        <br>

        ${i.cat} → ${i.sub}
        <br>

        ${i.qty} ${i.unit || ""} × ${i.price} =
        ${(i.qty * i.price).toFixed(2)} евро

    </div>

    <button
        class="delete-btn"
        onclick="removeItem(${index})">

        🗑

    </button>

</div>`;
    });

    document.getElementById("total").innerText =
    total.toFixed(2);
}



        function arrayBufferToBase64(buffer) {
            let binary = '';
            let bytes = new Uint8Array(buffer);
            for (let i = 0; i < bytes.byteLength; i++) {
                binary += String.fromCharCode(bytes[i]);
            }
            return window.btoa(binary);
        }
        
        
     



function generatePDF() {

    let offerNumber;
    let dateStr;
   

    if (editingOfferId) {

        let history =
        JSON.parse(localStorage.getItem("crm_history")) || [];

        let offer =
        history.find(o => o.id === editingOfferId);
      

        offerNumber =
        offer?.offerNumber ||
        ("OF-" + editingOfferId);

        dateStr =
        offer?.dateStr ||
        new Date().toLocaleDateString("bg-BG");

    } else {
 let currentOfferNumber = null;
        if (!currentOfferNumber) {
            currentOfferNumber = "OF-" + Date.now();
        }

        offerNumber = currentOfferNumber;

        dateStr =
        new Date().toLocaleDateString("bg-BG");
    }

    const docDefinition =
    createDocDefinition(
        offerNumber,
        dateStr
    );

    pdfMake
        .createPdf(docDefinition)
        .download(offerNumber + ".pdf");
}



        
        function newOffer() {
            
            
            if (!confirm("Сигурен ли си, че искаш нова оферта?")) return;
             localStorage.removeItem("crm_offer"); 
             sessionStorage.removeItem("crm_offer");
           
            items = [];
            render();
            
            document.getElementById("clientName").value = "";
            document.getElementById("clientAddress").value = "";
            document.getElementById("note").value = "";
            
            qty = 1;
            
            let qtyEl = document.getElementById("qty");
            
            
            if (qtyEl) {
                if (qtyEl.tagName !== "INPUT" && qtyEl.tagName !== "SELECT") {
                    qtyEl.innerText = qty;
                } else {
                    qtyEl.value = qty;
                }
            }
            
            document.getElementById("total").innerText = "0";
            document.getElementById("qty").value = 1;
            
            editingOfferId = null;
            
            document.getElementById("editMode").innerHTML = "";
        }
        
        function saveData() {
            
            const data = {
                items,
                clientName: document.getElementById("clientName").value,
                clientAddress: document.getElementById("clientAddress").value,
                note: document.getElementById("note").value
            };
            
            localStorage.setItem("crm_offer", JSON.stringify(data));
        }

function saveOffer() {

    if (items.length === 0) {
        alert("Няма артикули");
        return;
    }

    let history = JSON.parse(localStorage.getItem("crm_history")) || [];
    let existingOffer = history.find(o => o.id === editingOfferId);

    let offerNumber = existingOffer?.offerNumber || ("OF-" + Date.now());
    let dateStr = existingOffer?.dateStr || new Date().toLocaleDateString("bg-BG");

    const wasEditing = !!editingOfferId;
    const offerId = editingOfferId;

    const offer = {
        id: offerId || Date.now(),
        offerNumber,
        dateStr,
        date: new Date().toLocaleString("bg-BG"),
        clientName: document.getElementById("clientName").value || "-",
        clientAddress: document.getElementById("clientAddress").value || "-",
        note: document.getElementById("note").value || "",
        items: [...items],
        pdfBase64: ""
    };

    if (wasEditing) {
        history = history.map(o => o.id === offerId ? offer : o);
    } else {
        history.unshift(offer);
    }

    let docDefinition = createDocDefinition(
        offer.offerNumber,
        offer.dateStr
    );

    pdfMake.createPdf(docDefinition).getBuffer(function(buffer) {

        let base64 = arrayBufferToBase64(buffer);
        offer.pdfBase64 = base64;

        history = history.map(o => o.id === offer.id ? offer : o);
        localStorage.setItem("crm_history", JSON.stringify(history));
        renderHistory();

        alert(wasEditing ? "Офертата е обновена" : "Офертата е запазена");
    });

    // reset (ОК да е тук)
    editingOfferId = null;
    items = [];
    document.getElementById("clientName").value = "";
    document.getElementById("clientAddress").value = "";
    document.getElementById("note").value = "";
    document.getElementById("total").innerText = "0";
    document.getElementById("list").innerHTML = "";
    document.getElementById("editMode").innerHTML = "";
    document.getElementById("qty").value = 1;
}



function downloadPDF(base64, filename) {
    const link = document.createElement('a');
    link.href = "data:application/pdf;base64," + base64;
    link.download = filename + ".pdf";
    link.click();
}

function downloadOfferPDF(id) {
    let history = JSON.parse(localStorage.getItem("crm_history")) || [];
    let offer = history.find(o => o.id === id);
    if (!offer || !offer.pdfBase64) {
        alert("PDF не е наличен!");
        return;
    }
    try {
        const byteChars = atob(offer.pdfBase64);
        const byteNumbers = new Array(byteChars.length);
        for (let i = 0; i < byteChars.length; i++) {
            byteNumbers[i] = byteChars.charCodeAt(i);
        }
        const byteArray = new Uint8Array(byteNumbers);
        const blob = new Blob([byteArray], { type: 'application/pdf' });
        const url = URL.createObjectURL(blob);

        // Try to open in new tab/window (works better on many mobile browsers)
        const opened = window.open(url, '_blank');

        if (!opened) {
            // fallback to programmatic download
            const link = document.createElement('a');
            link.href = url;
            link.download = 'оферта_' + (offer.offerNumber || offer.id) + '.pdf';
            document.body.appendChild(link);
            link.click();
            link.remove();
        }

        // revoke object URL later
        setTimeout(() => URL.revokeObjectURL(url), 10000);
    } catch (e) {
        // last-resort fallback to data URL
        const link = document.createElement("a");
        link.href = "data:application/pdf;base64," + offer.pdfBase64;
        link.download = "оферта_" + (offer.offerNumber || offer.id) + ".pdf";
        link.click();
    }
}

            </div>
        </div>
        `;
    });
}

    if (!offer) return;

    editingOfferId = id;

    // 🔥 deep copy (важно)
    items = JSON.parse(JSON.stringify(offer.items || []));

    document.getElementById("clientName").value = offer.clientName || "";
    document.getElementById("clientAddress").value = offer.clientAddress || "";
    document.getElementById("note").value = offer.note || "";

    render();

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });
